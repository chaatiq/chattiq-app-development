name: chattiq_app
description: "Chattiq: WhatsApp-style inbox for your AI agent chats."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  app_settings: ^9.0.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  lucide_icons_flutter: ^3.1.24
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # The web dashboard's font. Only regular and bold ship (same as web).
  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/product-sans-regular.ttf
          weight: 400
        - asset: assets/fonts/product-sans-bold.ttf
          weight: 700

# App icon: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/android-icon-background.png
  adaptive_icon_foreground: assets/icon/android-icon-foreground.png
  adaptive_icon_monochrome: assets/icon/android-icon-monochrome.png
  min_sdk_android: 24
